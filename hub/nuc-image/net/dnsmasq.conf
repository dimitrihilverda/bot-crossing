# Bot Crossing hub — setup DHCP + captive DNS (first boot only).
# firstboot.sh substitutes __WIFI_IF__ and writes this to /etc/dnsmasq.d/bch-setup.conf while the
# AP is up. `address=/#/10.42.0.1` points every hostname at the portal, which is what makes a
# phone show its "Sign in to Wi-Fi" captive sheet the moment it joins.
interface=__WIFI_IF__
bind-interfaces
except-interface=lo
dhcp-range=10.42.0.10,10.42.0.100,255.255.255.0,12h
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.1
address=/#/10.42.0.1
no-resolv
no-hosts
