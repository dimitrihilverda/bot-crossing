# Bot Crossing hub — setup access point (transient, first boot only).
# firstboot.sh substitutes __WIFI_IF__ with the detected wireless interface and writes the result
# to /etc/hostapd/hostapd.conf. An OPEN network on purpose: it exists for a minute so a phone can
# join with one tap; no traffic of value crosses it.
interface=__WIFI_IF__
driver=nl80211
country_code=NL
ssid=BotCrossing-Setup
hw_mode=g
channel=6
auth_algs=1
ignore_broadcast_ssid=0
wmm_enabled=0
